name: deterministic safety and unit tests
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only doctor (zero-dependency core)
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m analog_agent.cli doctor --json --require-symlinks
      - name: Hash-pinned test-only plotting dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock
      - name: Deterministic tests (optional dependencies may be skipped)
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s tests -q
  gmid-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional lookup and build dependencies
        run: python -m pip install '.[gmid]' build
      - name: Synthetic lookup and release boundary tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p test_gmid.py -v
          python -m unittest discover -s tests -p test_public_release.py -v
      - name: Build with a private canary and check actual archives
        run: |
          mkdir -p private/gmid
          printf 'SYNTHETIC_PRIVATE_CANARY\n' > private/gmid/do-not-publish.csv
          python -m build --outdir dist
          python scripts/check_public_release.py dist/*.whl dist/*.tar.gz
