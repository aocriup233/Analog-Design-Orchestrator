name: deterministic safety and unit tests
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only doctor (zero-dependency core)
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m analog_agent.cli doctor --json
      - name: Hash-pinned test-only plotting dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock
      - name: Deterministic tests (optional dependencies may be skipped)
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s tests -q
