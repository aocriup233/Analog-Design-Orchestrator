[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "analog-agent"
version = "0.1.0"
description = "Analog Design Orchestrator: an artifact-driven analog IC design workflow"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
bridge = ["virtuoso-bridge"]
analysis = ["numpy>=1.23", "matplotlib>=3.7"]

[project.scripts]
analog-agent = "analog_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
analog_agent = ["*.mjs"]
