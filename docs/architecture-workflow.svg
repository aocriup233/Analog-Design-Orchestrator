<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="990" viewBox="0 0 1200 990" role="img" aria-labelledby="title desc">
  <title id="title">ADO 0.2.0 provisional architecture / ADO 暂定版架构</title>
  <desc id="desc">A user or external controller reviews decisions. Three deterministic workers exchange hash-pinned run artifacts. New 0.2.0 capabilities are shown explicitly: S1 doctor, S2 hash gate and task monitor, S3 failure recovery, ADO-01 state-first CLI, constrained MOBO, layout L1 through L4, and ADO-02 versioned adapter context.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 9 3.5 0 7Z" fill="#41566a"/></marker>
    <marker id="accent-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 9 3.5 0 7Z" fill="#2463a0"/></marker>
    <style>
      text{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1b2b3c}
      .title{font-size:29px;font-weight:750}.subtitle{font-size:15px;fill:#526477}
      .heading{font-size:19px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#4e6275}
      .label{font-size:13px;font-weight:700;letter-spacing:.04em}.mono{font-family:Consolas,"Cascadia Code",monospace;font-size:13px}
      .card{fill:#fff;stroke:#cad8e2;stroke-width:1.5}.private{fill:#fff9e9;stroke:#ddbf76;stroke-width:1.5}
      .decision{fill:#eaf3fc;stroke:#8bb4d8;stroke-width:1.5}.net{fill:#eaf7f3;stroke:#79b7a4;stroke-width:1.5}
      .sim{fill:#eef2fb;stroke:#91a8d6;stroke-width:1.5}.analysis{fill:#f7f0fa;stroke:#b99bca;stroke-width:1.5}
      .safety{fill:#f1f5f7;stroke:#9caebc;stroke-width:1.5}.campaign{fill:#eaf3fc;stroke:#8bb4d8;stroke-width:1.5}
      .layout{fill:#f7f4ec;stroke:#c3af85;stroke-width:1.5}.line{fill:none;stroke:#41566a;stroke-width:2.2;marker-end:url(#arrow)}
      .accent{fill:none;stroke:#2463a0;stroke-width:2.2;marker-end:url(#accent-arrow)}
    </style>
  </defs>
  <rect width="1200" height="990" rx="20" fill="#f8fafc"/>
  <text class="title" x="40" y="47">Analog Design Orchestrator</text>
  <text class="subtitle" x="40" y="72">Provisional 0.2.0-1015 · decisions are reviewed; workers are deterministic · 决策须审核，worker 确定性执行</text>

  <rect class="card" x="40" y="100" width="542" height="92" rx="14"/>
  <text class="heading" x="60" y="132">Public contracts / 公用契约</text>
  <text class="body" x="60" y="158">State machine · JSON + SHA-256 · typed operations</text>
  <text class="small" x="60" y="179">No PDK, site path, credential or circuit-specific rule</text>
  <rect class="private" x="602" y="100" width="558" height="92" rx="14"/>
  <text class="heading" x="622" y="132">User project / 用户私有工程</text>
  <text class="body" x="622" y="158">Circuit, TB, rules, PDK bindings and audited adapters</text>
  <text class="small" x="622" y="179">private/ is ignored · credentials stay outside artifacts</text>

  <rect class="decision" x="40" y="216" width="1120" height="88" rx="14"/>
  <text class="label" x="61" y="241" fill="#2463a0">DECISION LAYER / 决策层</text>
  <text class="heading" x="61" y="269">User or external LLM selects revision, testbench and candidates; reviews proposals and results</text>
  <text class="small" x="61" y="290">A proposal never submits a simulation or approves its own evidence</text>
  <path class="accent" d="M202 304V341"/>

  <rect class="net" x="40" y="350" width="348" height="238" rx="15"/>
  <text class="label" x="60" y="379" fill="#166d59">01 · NETLIST / 网表</text>
  <text class="heading" x="60" y="410">Block + selected TB</text>
  <text class="body" x="60" y="440">Render; check ports and inputs</text>
  <text class="body" x="60" y="465">Never run Spectre</text>
  <text class="mono" x="60" y="510">netlist_result.json</text>
  <text class="small" x="60" y="542">Immutable input.scs + hashes</text>
  <text class="small" x="60" y="565">CREATED → NETLIST_READY</text>

  <path class="line" d="M388 468H416"/>
  <rect class="sim" x="426" y="350" width="348" height="238" rx="15"/>
  <text class="label" x="446" y="379" fill="#405ca1">02 · SIMULATION / 仿真</text>
  <text class="heading" x="446" y="410">Deck + backend</text>
  <text class="body" x="446" y="440">Stage → submit → poll</text>
  <text class="body" x="446" y="465">Retrieve → verify → clean</text>
  <text class="mono" x="446" y="510">simulation_result.json</text>
  <text class="small" x="446" y="542">Bridge / local / LSF / external</text>
  <text class="small" x="446" y="565">UNKNOWN_STATE requires reconcile</text>

  <path class="line" d="M774 468H802"/>
  <rect class="analysis" x="812" y="350" width="348" height="238" rx="15"/>
  <text class="label" x="832" y="379" fill="#7850a1">03 · ANALYSIS / 分析</text>
  <text class="heading" x="832" y="410">Metrics + verdict</text>
  <text class="body" x="832" y="440">Only verified simulation data</text>
  <text class="body" x="832" y="465">User-defined acceptance rules</text>
  <text class="mono" x="832" y="510">analysis_result.json</text>
  <text class="small" x="832" y="542">PASS / FAIL ≠ universal spec</text>
  <text class="small" x="832" y="565">Review before next iteration</text>

  <text class="label" x="40" y="622" fill="#425a6b">NEW IN 0.2.0 CANDIDATE / 本暂定版新增能力</text>
  <path class="accent" d="M600 588V644"/>
  <path class="line" d="M987 588V644"/>

  <rect class="safety" x="40" y="654" width="348" height="292" rx="15"/>
  <text class="label" x="60" y="683" fill="#425a6b">SAFETY + RECOVERY / 安全恢复</text>
  <text class="heading" x="60" y="716">S1–S3 + ADO-01</text>
  <text class="body" x="60" y="748">S1 · read-only doctor</text>
  <text class="body" x="60" y="776">S2 · input hash gate + monitor</text>
  <text class="body" x="60" y="804">S3 · classified, bounded retry</text>
  <text class="small" x="60" y="832">Append-only attempts preserve evidence</text>
  <text class="small" x="60" y="864">ADO-01 · state-first CLI reports</text>
  <text class="small" x="60" y="884">UNKNOWN_STATE → reconcile first</text>
  <text class="small" x="60" y="922">No automatic resubmission</text>

  <rect class="campaign" x="426" y="654" width="348" height="292" rx="15"/>
  <text class="label" x="446" y="683" fill="#2463a0">CAMPAIGN + MOBO / 迭代优化</text>
  <text class="heading" x="446" y="716">Review before every cycle</text>
  <text class="body" x="446" y="748">Bounded parallel runs</text>
  <text class="body" x="446" y="776">Comparison + Pareto evidence</text>
  <text class="small" x="446" y="804">MOBO · constrained batch proposals</text>
  <text class="small" x="446" y="832">Sobol cold start; never auto-add</text>
  <text class="small" x="446" y="864">Memory · reviewed and bounded</text>
  <text class="small" x="446" y="884">Replay · no new run or simulator</text>
  <text class="small" x="446" y="922">User chooses next cycle or finish</text>
  <path class="accent" d="M600 946V966H21V258H35"/>

  <rect class="layout" x="812" y="654" width="348" height="292" rx="15"/>
  <text class="label" x="832" y="683" fill="#79633c">LAYOUT + ADO-02 / 版图</text>
  <text class="heading" x="832" y="716">Opt-in, linked run</text>
  <text class="body" x="832" y="748">L1 · manual floorplan freeze</text>
  <text class="body" x="832" y="776">L2 · constraints + review gate</text>
  <text class="body" x="832" y="804">L3 · routing + DRC/LVS loop</text>
  <text class="small" x="832" y="832">L4 · plugin proposals, no auto-place</text>
  <text class="small" x="832" y="864">ADO-02 · versioned run context</text>
  <text class="small" x="832" y="884">for audited typed adapters</text>
  <text class="small" x="832" y="906">PEX → post-layout: not integrated</text>
  <text class="small" x="832" y="928">Live tool flow not yet certified</text>
</svg>
